[project]
name = "orders-data-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ email = "pedroifgonzalez@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
generate-orders = "orders_data_analysis.generator.csv_generator:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.0,<10.0",
]
